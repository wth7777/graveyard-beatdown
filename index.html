<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Graveyard Beatdown — Ghosts 'n Goblins Tribute</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:#0a0a0a;width:100%;height:100%;overflow:hidden}#game-container{z-index:10;justify-content:center;align-items:center;width:100%;height:100%;display:flex;position:relative}canvas{display:block}.loading-overlay{color:#e0e0e0;z-index:1000;background:#1a1a1a;flex-direction:column;justify-content:center;align-items:center;font-family:Courier New\, monospace;display:flex;position:fixed;inset:0}.loading-bar{background:#333;border-radius:4px;width:300px;height:8px;margin-top:16px;overflow:hidden}.loading-fill{background:#4ade80;width:0%;height:100%;transition:width .1s}#touch-controls{pointer-events:auto;z-index:100;justify-content:space-between;align-items:flex-end;padding:10px;display:flex;position:absolute;bottom:20px;left:0;right:0}.dpad{flex-direction:column;align-items:center;gap:4px;display:flex}.dpad-row{align-items:center;gap:4px;display:flex}.dpad-spacer,.dpad-center{width:44px;height:44px}.dpad-btn{color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:none;background:#ffffff26;border:2px solid #fff6;border-radius:10px;justify-content:center;align-items:center;width:44px;height:44px;font-size:20px;font-weight:700;display:flex}.dpad-btn:active{background:#ffffff59}.action-buttons{align-items:flex-end;gap:12px;display:flex}.action-btn{color:#fff;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:none;border:2px solid #ffffff80;border-radius:28px;justify-content:center;align-items:center;width:56px;height:56px;font-size:16px;font-weight:700;display:flex}.action-btn.attack{background:#ff505040;border-color:#ff787899}.action-btn.jump{background:#5078ff40;border-color:#78b4ff99}.action-btn.special{background:#c850ff40;border-color:#f078ff99}.action-btn:active{background:#fff3}#diag-panel{z-index:99999;color:#0f0;background:#000000e6;border:2px solid #0f0;border-radius:4px;max-width:400px;padding:10px;font-family:Courier New\, monospace;font-size:14px;display:block;position:fixed;top:10px;left:10px}#diag-panel .stage{margin:4px 0}#diag-panel .stage.ok{color:#0f0}#diag-panel .stage.fail{color:red}#diag-panel .stage.info{color:#ff0}</style>
  <script type="module" crossorigin src="./assets/index-CfJsqfcu.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <div id="touch-controls">
    <div class="dpad">
      <div class="dpad-row">
        <div class="dpad-spacer"></div>
        <button id="btn-up" class="dpad-btn up">▲</button>
        <div class="dpad-spacer"></div>
      </div>
      <div class="dpad-row">
        <button id="btn-left" class="dpad-btn left">◀</button>
        <div class="dpad-center"></div>
        <button id="btn-right" class="dpad-btn right">▶</button>
      </div>
      <div class="dpad-row">
        <div class="dpad-spacer"></div>
        <button id="btn-down" class="dpad-btn down">▼</button>
        <div class="dpad-spacer"></div>
      </div>
    </div>
    <div class="action-buttons">
      <button id="btn-jump" class="action-btn jump">JUMP</button>
      <button id="btn-attack" class="action-btn attack">ATTACK</button>
    </div>
  </div>
  <div id="diag-panel">
    <div style="font-weight: bold; color: #ffffff; margin-bottom: 8px;">GRAVEYARD BEATDOWN — DIAGNOSTICS</div>
    <div id="diag-stage-init" class="stage info">INIT: HTML loaded</div>
    <div id="diag-stage-phaser" class="stage info">PHASER: waiting...</div>
    <div id="diag-stage-boot" class="stage info">BOOT: waiting...</div>
    <div id="diag-stage-main" class="stage info">MAIN: waiting...</div>
    <div id="diag-stage-ui" class="stage info">UI: waiting...</div>
    <div id="diag-errors" class="stage fail" style="display:none;"></div>
  </div>
  <div id="loading-overlay" class="loading-overlay">
    <div style="font-size: 24px; font-weight: bold; letter-spacing: 2px;">GRAVEYARD BEATDOWN</div>
    <div style="font-size: 14px; margin-top: 8px; opacity: 0.8;">Loading assets...</div>
    <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  </div>
  <script>
    window.__hideLoading = function () {
      const el = document.getElementById('loading-overlay')
      if (el) { el.style.transition = 'opacity 0.3s ease'; el.style.opacity = '0'; setTimeout(() => { el.style.display = 'none' }, 300) }
    }
    window.__showError = function (msg) {
      const el = document.getElementById('loading-overlay')
      if (el) { el.innerHTML = '<div style="color:#ff4444;font-weight:bold;">LOAD ERROR</div><div style="color:#e0e0e0;margin-top:8px;">' + msg + '</div>'; el.style.background = '#1a0000' }
      console.error('GAME LOAD ERROR:', msg)
    }
  </script>
</body>
</html>
